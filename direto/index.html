<style>
:root{
  --branco: #FFFFFF;
  --titulo: #030712;
  --suave: #6B7280;
  --linha: #E5E7EB;
  --alerta: #DC2626;
  --raio: 16px;
  --container: 400px;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:var(--branco);
  color:var(--titulo);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 0;
}

.vsl-wrap{
  width:100%;
  max-width:var(--container);
  padding:0 16px;
}

.vsl-player{
  position:relative;
  width:100%;
  border-radius:var(--raio);
  overflow:hidden;
  background:#FFFFFF;
}
.vsl-player vturb-smartplayer{ display:block; width:100%; }

/* ---------- Pessoas assistindo ao vivo ---------- */
.ao-vivo{
  position:absolute;
  left:12px;
  bottom:28px;               /* acima da barra de progresso; o JS sobe esse valor quando o botão aparece */
  transition:bottom .4s ease;
  z-index:999;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(220,38,38,.78);   /* vermelho translúcido: ajuste o .78 se quiser mais/menos transparente */
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  font-size:13px;
  line-height:1;
  color:#FFFFFF;
  pointer-events:none;       /* o clique passa direto para o player */
}
.ao-vivo strong{
  color:#FFFFFF;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.ao-vivo-ponto{
  width:8px; height:8px;
  border-radius:50%;
  background:#FFFFFF;
  animation:pulsa 1.8s ease-in-out infinite;
}
@keyframes pulsa{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.35; transform:scale(.8); }
}

/* ---------- Vagas (aparece no início do pitch) ---------- */
.vagas{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid var(--linha);
  border-radius:var(--raio);
  opacity:0;
  transform:translateY(6px);
  transition:opacity .5s ease, transform .5s ease;
}
.vagas[hidden]{ display:none; }
.vagas.visivel{ opacity:1; transform:none; }

.vagas-topo{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  font-size:20px;
  font-weight:700;
  color:#000000;
}
.vagas-numero{
  font-size:36px;
  font-weight:800;
  line-height:1;
  color:var(--titulo);
  font-variant-numeric:tabular-nums;
  transition:color .3s ease;
}
.vagas-numero.baixo{ color:var(--alerta); }
.vagas-numero.bump{ animation:bump .35s ease; }
@keyframes bump{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.15); }
  100%{ transform:scale(1); }
}

.vagas-barra{
  margin-top:10px;
  height:6px;
  border-radius:999px;
  background:var(--linha);
  overflow:hidden;
}
.vagas-barra i{
  display:block;
  height:100%;
  width:100%;
  border-radius:999px;
  background:var(--alerta);
  transition:width .6s ease;
}

/* ---------- Notificação de compra (topo do player) ---------- */
.notificacao{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:999;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  color:var(--titulo);
  pointer-events:none;
  opacity:0;
  transform:translateY(-14px);
  transition:opacity .35s ease, transform .35s ease;
}
.notificacao.visivel{ opacity:1; transform:none; }

.notificacao-icone{
  flex:0 0 auto;
  width:36px; height:36px;
  border-radius:10px;
  background:#16A34A;
  display:flex;
  align-items:center;
  justify-content:center;
}
.notificacao-icone svg{ width:20px; height:20px; display:block; }

.notificacao-corpo{ flex:1 1 auto; min-width:0; }
.notificacao-topo{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  line-height:1.2;
  color:var(--suave);
}
.notificacao-topo b{ color:var(--titulo); font-weight:700; }
.notificacao-texto{
  margin-top:2px;
  font-size:13px;
  line-height:1.3;
  color:var(--titulo);
}

@media (prefers-reduced-motion: reduce){
  .ao-vivo-ponto,
  .vagas-numero.bump{ animation:none; }
  .vagas{ transition:none; }
  .notificacao{ transition:opacity .2s ease; transform:none; }
}

<script>

const CONFIG = {
  checkoutUrl: 'https://app.ephra.io/checkout/5do1xf2',
  vslPlayerUrl: 'https://scripts.converteai.net/5c44636d-2807-4c36-8d21-6fb4390eaef0/players/6abd88622680d88ef7f9cd52/v4/player.js'
};

const s = document.createElement('script');
s.src = CONFIG.vslPlayerUrl;
s.async = true;
document.head.appendChild(s);

/* ============================================================
 * Checkout — preserva utm_*, fbclid, gclid e vk_source/vk_ad_id
 * (mantida caso o botão do vídeo use HTML customizado chamando
 * window.irParaCheckout(); se o botão usar o campo "Link" nativo
 * do vturb, essa função não é necessária)
 * ============================================================ */
function montarUrlCheckout(base){
  const destino = base || CONFIG.checkoutUrl;
  let url;
  try{ url = new URL(destino); } catch(e){ return destino; }

  new URLSearchParams(window.location.search).forEach((valor, chave) => {
    const k = chave.toLowerCase();
    if (k.startsWith('utm_') || k === 'fbclid' || k === 'gclid' || k === 'vk_source' || k === 'vk_ad_id') url.searchParams.set(chave, valor);
  });

  return url.toString();
}

function irParaCheckout(){
  window.location.href = montarUrlCheckout();
}
window.irParaCheckout = irParaCheckout;
</script>

<script>
/* ============================================================
 * Contadores sincronizados com o vídeo (vturb)
 *
 * AJUSTE ESTES VALORES (em segundos):
 *   duracaoVideo  -> duração total do vídeo
 *   pitchInicio   -> segundo em que o pitch começa
 *   pitchFim      -> segundo em que as vagas devem chegar a 04
 *                    (use null para ir até o fim do vídeo)
 * ============================================================ */
const CONTADORES = {
  debug: false,                 // true = mostra logs no console para testar
  duracaoVideo: 950,            // duração do vídeo: 15:50 (15*60 + 50)
  pitchInicio: 864,             // pitch começa em 14:24 (14*60 + 24)
  pitchFim: null,               // null = vagas chegam a 04 no fim do vídeo

  proporcaoVideo: 16 / 9,       // altura / largura do vídeo (9:16 vertical = 16/9)
  topoVideoManual: 0,           // plano B: altura (px) do título acima do vídeo, só usada se o código não achar o <video>

  // Quando o botão do vturb aparece (14:24), o contador "ao vivo" sobe para não ficar em cima dele
  aoVivoSobe: {
    em: 864,                    // segundo em que o botão aparece (14:24)
    px: 100                     // quantos pixels o contador sobe (aumente se ainda tocar no botão)
  },

  aoVivoInicio: 112,
  aoVivoFim: 94,

  vagasInicio: 49,
  vagasFim: 4,

  notificacoes: {
    nomes: ['Rafaela', 'Juliana', 'Camila', 'Fernanda', 'Mariana', 'Patrícia', 'Bruna', 'Aline',
            'Larissa', 'Bianca', 'Vanessa', 'Carla', 'Gabriel', 'Lucas', 'Rodrigo', 'Thiago',
            'Marcos', 'Felipe', 'Pedro', 'Diego'],
    inicio: 864,            // segundo do vídeo em que começam (14:24, junto com o pitch)
    duracao: 4500,          // tempo que cada notificação fica na tela (ms)
    intervaloMin: 13000,    // intervalo mínimo entre notificações (ms)
    intervaloMax: 23000     // intervalo máximo entre notificações (ms)
  },

  backredirect: {
    ativo: true,
    inicio: 0,              // segundo do vídeo a partir do qual vale (0 = desde o início do vídeo; null = só a partir do pitch)
    destino: '/back/'       // página para onde o botão "voltar" manda a pessoa
  }
};

(function(){
  const C = CONTADORES;
  const log = (...a) => { if (C.debug) console.log('[contadores]', ...a); };

  const elPlayer   = document.getElementById('vid-6abd88622680d88ef7f9cd52');
  const elAoVivo   = document.getElementById('aoVivoNumero');
  const elVagas    = document.getElementById('vagas');
  const elVagasNum = document.getElementById('vagasNumero');
  const elVagasBar = document.getElementById('vagasBarra');

  const pitchFim = C.pitchFim || C.duracaoVideo;
  const rand = (min, max) => min + Math.random() * (max - min);
  const pad2 = n => String(n).padStart(2, '0');

  /* ---------- tempo do vídeo ---------- */
  let tempo = 0;
  let tocando = false;
  let recebeuTimeupdate = false;
  let ultimoUpdate = 0;

  function lerTempo(arg){
    if (typeof arg === 'number') return arg;
    if (arg && typeof arg.currentTime === 'number') return arg.currentTime;
    if (arg && arg.detail){
      if (typeof arg.detail === 'number') return arg.detail;
      if (typeof arg.detail.currentTime === 'number') return arg.detail.currentTime;
    }
    return null;
  }

  function aoTimeupdate(arg){
    const t = lerTempo(arg);
    if (t === null || !isFinite(t)) return;
    recebeuTimeupdate = true;
    if (t !== tempo) tocando = true;   // o tempo avançou = o vídeo está tocando
    tempo = t;
    ultimoUpdate = Date.now();
    renderVagas();
    verificarNotificacoes();
  }

  // Plano B: se o player não emitir timeupdate, conta o tempo com play/pause
  setInterval(() => {
    if (recebeuTimeupdate && tocando && Date.now() - ultimoUpdate > 2000){
      tocando = false;                 // tempo parou de avançar = pausado
    }
    if (tocando && !recebeuTimeupdate){
      tempo += 1;
      renderVagas();
      verificarNotificacoes();
    }
  }, 1000);

  /* ---------- pessoas assistindo ao vivo (112 -> 94) ---------- */
  let aoVivo = C.aoVivoInicio;

  function alvoAoVivo(){
    const p = Math.min(1, Math.max(0, tempo / C.duracaoVideo));
    return C.aoVivoInicio - (C.aoVivoInicio - C.aoVivoFim) * p;
  }

  function tickAoVivo(){
    if (tocando || tempo > 0){
      const alvo = Math.round(alvoAoVivo());
      let novo = aoVivo;

      if (aoVivo > alvo){
        novo -= (Math.random() < 0.25 ? 2 : 1);   // desce acompanhando a curva
      } else {
        const r = Math.random();                   // oscila perto da curva
        if (r < 0.25) novo -= 1;
        else if (r > 0.80) novo += 1;
      }

      novo = Math.max(C.aoVivoFim, Math.min(C.aoVivoInicio, novo));
      if (novo !== aoVivo){
        aoVivo = novo;
        elAoVivo.textContent = aoVivo;
      }
    }
    setTimeout(tickAoVivo, rand(3500, 8000));
  }
  tickAoVivo();

  /* ---------- notificações de compra (começam com o pitch) ---------- */
  const elNotif      = document.getElementById('notificacao');
  const elNotifNome  = document.getElementById('notifNome');
  const elNotifTempo = document.getElementById('notifTempo');
  let notifIniciado = false;
  let ultimoNome = null;

  function mostrarNotificacao(){
    const nomes = C.notificacoes.nomes;
    let nome;
    do { nome = nomes[Math.floor(Math.random() * nomes.length)]; }
    while (nome === ultimoNome && nomes.length > 1);
    ultimoNome = nome;

    elNotifNome.textContent = nome;
    elNotifTempo.textContent = Math.random() < 0.7 ? 'agora' : 'há ' + (1 + Math.floor(Math.random() * 3)) + ' min';

    log('notificação:', nome);
    elNotif.classList.add('visivel');
    setTimeout(() => elNotif.classList.remove('visivel'), C.notificacoes.duracao);
  }

  function agendarNotificacao(primeira){
    const espera = primeira ? rand(3000, 5000) : rand(C.notificacoes.intervaloMin, C.notificacoes.intervaloMax);
    setTimeout(() => {
      if (tocando) mostrarNotificacao();   // só aparece enquanto o vídeo está tocando
      agendarNotificacao(false);
    }, espera);
  }

  function iniciarNotificacoes(){
    if (notifIniciado) return;
    notifIniciado = true;
    log('iniciando notificações');
    agendarNotificacao(true);
  }

  function verificarNotificacoes(){
    if (tempo >= C.notificacoes.inicio) iniciarNotificacoes();
    armarBackredirect();   // aproveita o mesmo gatilho de tempo para armar o backredirect
    ajustarAoVivo();       // sobe o contador "ao vivo" quando o botão aparece
  }

  /* ---------- vagas (49 -> 04, de 2 em 2 e 3 em 3) ---------- */
  // Sorteia uma sequência de passos 2 e 3 que soma exatamente 49 - 4 = 45
  function sortearPassos(total){
    const passos = [];
    let resto = total;
    while (resto > 0){
      let p = Math.random() < 0.5 ? 2 : 3;
      if (resto - p === 1) p = (p === 2 ? 3 : 2);  // evita sobrar 1
      if (p > resto) p = resto;                    // segurança
      passos.push(p);
      resto -= p;
    }
    return passos;
  }

  const passos = sortearPassos(C.vagasInicio - C.vagasFim);

  // Distribui as quedas ao longo do pitch, com tempos irregulares
  const janela = (pitchFim - C.pitchInicio) * 0.96;
  const momentos = passos
    .map((_, i) => C.pitchInicio + ((i + 0.5 + rand(-0.35, 0.35)) / passos.length) * janela)
    .sort((a, b) => a - b);

  let vagasMostrando = false;
  let vagasAtual = null;

  function renderVagas(){
    if (tempo < C.pitchInicio) return;

    if (!vagasMostrando){
      vagasMostrando = true;
      elVagas.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => elVagas.classList.add('visivel')));
      log('pitch começou, mostrando vagas');
    }

    let vagas = C.vagasInicio;
    for (let i = 0; i < momentos.length; i++){
      if (tempo >= momentos[i]) vagas -= passos[i];
    }
    vagas = Math.max(C.vagasFim, vagas);

    if (vagas !== vagasAtual){
      const primeira = vagasAtual === null;
      vagasAtual = vagas;
      elVagasNum.textContent = pad2(vagas);
      elVagasNum.classList.toggle('baixo', vagas <= 10);
      elVagasBar.style.width = Math.max(4, (vagas / C.vagasInicio) * 100) + '%';

      if (!primeira){
        elVagasNum.classList.remove('bump');
        void elVagasNum.offsetWidth;
        elVagasNum.classList.add('bump');
      }
    }
  }

  /* ---------- posição dos elementos sobre o VÍDEO ---------- */
  // O player do vturb tem título, subtítulo e botão além do vídeo, então a altura
  // do container não serve de referência. Aqui o código procura o <video> de verdade
  // (inclusive dentro de shadow DOM) e posiciona o contador e a notificação nele.
  const elAoVivoBox   = document.querySelector('.ao-vivo');
  const elNotifBox    = document.getElementById('notificacao');
  const elWrapPlayer  = document.querySelector('.vsl-player');
  const BASE_AO_VIVO  = 28;   // distância do contador até o fundo do player, antes do botão aparecer

  // Sobe o contador quando o botão do vturb aparece, para ele não ficar em cima
  function ajustarAoVivo(){
    const sobe = tempo >= C.aoVivoSobe.em ? C.aoVivoSobe.px : 0;
    elAoVivoBox.style.bottom = (BASE_AO_VIVO + sobe) + 'px';
  }
  const MARGEM_TOPO   = 20;   // distância da notificação até o topo do vídeo
  let videoEl = null;
  let avisouPlanoB = false;

  function acharVideo(no){
    if (!no || !no.querySelector) return null;
    const v = no.querySelector('video');
    if (v) return v;
    const todos = no.querySelectorAll('*');
    for (let i = 0; i < todos.length; i++){
      if (todos[i].shadowRoot){
        const achado = acharVideo(todos[i].shadowRoot);
        if (achado) return achado;
      }
    }
    return null;
  }

  function posicionarSobreVideo(){
    const base = elWrapPlayer.getBoundingClientRect();
    if (!base.width) return;

    if (!videoEl || !videoEl.isConnected){
      videoEl = acharVideo(elPlayer.shadowRoot) || acharVideo(elPlayer);
      if (videoEl) log('vídeo encontrado dentro do player');
    }

    let topoVideo, fundoVideo;
    if (videoEl){
      const r = videoEl.getBoundingClientRect();
      if (r.height > 50){
        topoVideo  = r.top    - base.top;
        fundoVideo = r.bottom - base.top;
      }
    }

    if (topoVideo === undefined){
      // Plano B: não achou o <video>; usa a proporção e o deslocamento manual
      if (!avisouPlanoB){ avisouPlanoB = true; log('vídeo NÃO encontrado, usando plano B (topoVideoManual)'); }
      topoVideo  = C.topoVideoManual || 0;
      fundoVideo = topoVideo + base.width * C.proporcaoVideo;
    }

    elNotifBox.style.top  = Math.max(0, topoVideo + MARGEM_TOPO) + 'px';
  }

  posicionarSobreVideo();
  window.addEventListener('resize', posicionarSobreVideo);
  window.addEventListener('load', posicionarSobreVideo);
  setInterval(posicionarSobreVideo, 500);   // acompanha o título/botão do vturb aparecendo e mudando de tamanho

  /* ---------- backredirect (botão voltar -> /back/) ---------- */
  const BR = C.backredirect;
  let brArmado = false;
  let interagiu = false;

  function brInicio(){ return BR.inicio === null ? C.pitchInicio : BR.inicio; }

  // Leva a query string inteira (utm_*, fbclid, gclid, sck, vk_*...) para a /back/ repassar ao checkout
  function urlBack(){ return BR.destino + window.location.search; }

  // O Chrome ignora entradas de histórico criadas sem interação do usuário,
  // então só "armamos" depois de um toque/clique/tecla na página.
  function armarBackredirect(){
    if (!BR.ativo || brArmado || !interagiu || tempo < brInicio()) return;
    brArmado = true;
    try { history.pushState({ backredirect: true }, '', location.href); } catch(e){}
    log('backredirect armado');
  }

  ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => {
    window.addEventListener(ev, () => { interagiu = true; armarBackredirect(); }, { passive: true });
  });

  window.addEventListener('popstate', () => {
    if (!brArmado) return;
    brArmado = false;
    try { if (window.fbq) fbq('trackCustom', 'BackRedirect'); } catch(e){}
    log('backredirect -> ' + urlBack());
    window.location.replace(urlBack());   // replace: o "voltar" da /back/ não cai de novo nesta página
  });

  /* ---------- conexão com o player do vturb ---------- */
  let conectado = false;

  function conectar(){
    if (conectado) return true;

    let inst = null;
    if (elPlayer && typeof elPlayer.on === 'function') inst = elPlayer;
    else if (window.smartplayer && window.smartplayer.instances && window.smartplayer.instances[0]) inst = window.smartplayer.instances[0];

    if (!inst || typeof inst.on !== 'function') return false;

    inst.on('timeupdate', aoTimeupdate);
    inst.on('play',  () => { tocando = true;  log('play'); verificarNotificacoes(); });
    inst.on('pause', () => { tocando = false; log('pause'); });
    inst.on('ended', () => { tocando = false; log('ended'); });

    conectado = true;
    log('conectado ao player');
    return true;
  }

  elPlayer.addEventListener('player:ready', conectar);

  let tentativas = 0;
  const poll = setInterval(() => {
    tentativas++;
    if (conectar() || tentativas > 120) clearInterval(poll);
  }, 500);
})();
</script>

</body>
</html>
